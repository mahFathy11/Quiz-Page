<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="quiz.css">
</head>

<body>
    <div class="cateogry">
    </div>
    <div class="quiz">
        <div class="info">
            <div class="cat">Cateogry: <span></span></div>
            <div class="count">Question Count : <span></span></div>
        </div>
        <div class="container">
        </div>
        <input class="submit" type="submit" value="Submit Answer">
        <div class="check">
            <div class="circle">
            </div>
            <div class="time"><span class="minute"></span>:<span class="second"></span></div>
        </div>
        <div class="result">Your Correct Answers are <span class="true"></span> And Your Wrong Answers Are <span
                class="false"></span></div>
    </div>
    <script src="quiz.js"></script>
</body>

</html>
